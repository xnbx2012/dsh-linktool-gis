[project]
name = "color-style-mcp-server"
version = "0.1.0"
description = "ArcGIS地图制图MCP服务器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.3",
    "mcp>=1.26,<2",
]

[project.scripts]
color-style-server = "color_style_server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
